# Static serving for the Angular production build.
# Installed as /etc/nginx/conf.d/default.conf by the Dockerfile.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # index.html names the hashed bundles, so it must always be revalidated.
  location = /index.html {
    expires -1;
  }

  # Angular emits content-hashed .js and .css files; they can be cached for a long time.
  location ~* \.(?:js|css)$ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
